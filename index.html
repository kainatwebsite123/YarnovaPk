<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Boutique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Crochet Boutique</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Handmade Crochet Creations</h2>
    <p>Soft, cozy, and handmade with love.</p>
  </section>

  <section class="products">

    <div class="card">
      <img src="https://via.placeholder.com/250" alt="Crochet Hat">
      <h3>Crochet Hat</h3>
      <p>$25</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/250" alt="Crochet Bag">
      <h3>Crochet Bag</h3>
      <p>$40</p>
      <button>Add to Cart</button>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
